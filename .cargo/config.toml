# Локальные флаги сборки — ЕДИНСТВЕННЫЙ источник `-L` для линковки libmpv.
#
# Почему это здесь, а не в `$env:RUSTFLAGS` внутри build.ps1: cargo включает
# флаги в отпечаток (fingerprint) каждого крейта. Разные флаги у ручных
# `cargo ...` и у скриптов = полная пересборка всех зависимостей при каждом
# переключении + дубликаты их артефактов в target/. С этим файлом флаги
# одинаковые у любых вызовов из корня репо — кэш общий, пересборки только
# инкрементальные (сменился исходник/фичи/профиль).
#
# Относительный путь резолвится от корня пакета (cargo запускает rustc
# с cwd = корень пакета), поэтому работает из любого каталога вызова.
# Каталога может не быть (чистый клон, --no-video): rustc молча пропускает
# несуществующие -L пути, на проверку/клиппи/тесты без фичи video не влияет.
[build]
rustflags = ["-L", "mpvlib-local"]
