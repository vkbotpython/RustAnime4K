name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: anime4k-player-windows-x86_64.zip
          - os: ubuntu-22.04
            archive: anime4k-player-linux-x86_64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libgl1-mesa-dev \
            libmpv-dev patchelf

      - name: Prepare libmpv (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Official mpv builds ship libmpv-2.dll (in the mpv-dev package)
          # but no import lib, so generate mpv.lib from the DLL exports.
          New-Item -ItemType Directory -Force mpvlib | Out-Null
          $rel = Invoke-RestMethod 'https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest'
          $asset = @($rel.assets | Where-Object { $_.name -match '^mpv-dev-x86_64-\d.*\.7z$' })[0]
          if (-not $asset) { throw 'libmpv archive not found in latest mpv release' }
          Invoke-WebRequest $asset.browser_download_url -OutFile mpv.7z
          7z x mpv.7z -ompv_dist 'libmpv-2.dll' -y | Out-Null
          $dll = Get-ChildItem mpv_dist -Recurse -Filter libmpv-2.dll | Select-Object -First 1
          if (-not $dll) { throw 'libmpv-2.dll not found in archive' }
          # dumpbin/lib ship with VS BuildTools; locate them directly
          # (vswhere output is unreliable across runner images).
          $dumpbin = Get-ChildItem 'C:/Program Files/Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          if (-not $dumpbin) {
            $dumpbin = Get-ChildItem 'C:/Program Files (x86)/Microsoft Visual Studio' -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          }
          if (-not $dumpbin) { throw 'dumpbin.exe (VS BuildTools) not found' }
          $tool = $dumpbin.DirectoryName
          $names = & "$tool/dumpbin.exe" /exports $dll.FullName |
            Select-String '^\s+\d+\s+[0-9A-F]+\s+[0-9A-F]+\s+(\S+)' |
            ForEach-Object { $_.Matches.Groups[1].Value }
          if (-not $names) { throw 'no exports parsed from libmpv-2.dll' }
          @('LIBRARY libmpv-2', 'EXPORTS') + $names | Out-File mpv.def -Encoding ascii
          & "$tool/lib.exe" "/def:$PWD/mpv.def" '/out:mpvlib/mpv.lib' '/machine:x64'
          if ($LASTEXITCODE -ne 0) { throw 'lib.exe failed' }
          # The loader finds the DLL next to the exe: pre-place it so the
          # smoke test below passes, reuse it for packaging + installer.
          New-Item -ItemType Directory -Force target/release | Out-Null
          Copy-Item $dll.FullName target/release/libmpv-2.dll
          "RUSTFLAGS=-L $PWD/mpvlib" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - uses: dtolnay/rust-toolchain@stable

      # Full build: real playback + hardware decoding (hwdec=auto-safe).
      - run: cargo build --release --features video

      - name: Loader smoke test (Windows)
        if: runner.os == 'Windows'
        run: ./target/release/anime4k-player.exe --help

      - name: Loader smoke test (Linux, system libmpv)
        if: runner.os == 'Linux'
        run: ./target/release/anime4k-player --help

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/anime4k-player | Out-Null
          Copy-Item target/release/anime4k-player.exe dist/anime4k-player/
          Copy-Item target/release/libmpv-2.dll dist/anime4k-player/
          Copy-Item assets/shaders dist/anime4k-player/shaders -Recurse
          Copy-Item README.md, LICENSE dist/anime4k-player/
          Compress-Archive -Path dist/anime4k-player -DestinationPath ${{ matrix.archive }}

      - name: Inno Setup installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' packaging/windows/installer.iss
          Move-Item packaging/windows/Output/*.exe dist/ -Force

      - name: Package (Linux, bundled libmpv)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist/anime4k-player/lib
          cp target/release/anime4k-player dist/anime4k-player/
          cp -r assets/shaders dist/anime4k-player/
          cp packaging/linux/*.desktop README.md LICENSE dist/anime4k-player/
          # Bundle libmpv.so + its private deps (ffmpeg chain, ...).
          # Host-provided stacks (glibc, X11/Wayland, Mesa/GL, DRM) are excluded.
          EXCLUDE='^lib(c|m|dl|pthread|rt|resolv)\.so|ld-linux|libGL\.|libEGL\.|libGLX|libGLdispatch|libOpenGL|libX11\.|libxcb\.|libXau\.|libXdmcp\.|libxkb|libwayland|libdrm\.|libvulkan\.|libgbm\.'
          mapfile -t QUEUE < <(ldd target/release/anime4k-player | grep -oP '=> \K/\S+')
          declare -A SEEN=()
          while [ "${#QUEUE[@]}" -gt 0 ]; do
            LIB="${QUEUE[0]}"; QUEUE=("${QUEUE[@]:1}")
            BASE="$(basename "$LIB")"
            [ -n "${SEEN[$BASE]:-}" ] && continue
            SEEN[$BASE]=1
            echo "$BASE" | grep -Eq "$EXCLUDE" && continue
            cp -L "$LIB" "dist/anime4k-player/lib/$BASE"
            while read -r DEP; do
              [ -n "$DEP" ] && QUEUE+=("$DEP")
            done < <(ldd "$LIB" 2>/dev/null | grep -oP '=> \K/\S+')
          done
          patchelf --set-rpath '$ORIGIN/lib' --force-rpath dist/anime4k-player/anime4k-player
          for F in dist/anime4k-player/lib/*.so*; do
            patchelf --set-rpath '$ORIGIN' --force-rpath "$F" 2>/dev/null || true
          done
          echo '--- bundled libs ---'
          ls dist/anime4k-player/lib
          echo '--- ldd of shipped binary (must use lib/ paths, no "not found") ---'
          ldd dist/anime4k-player/anime4k-player
          if ldd dist/anime4k-player/anime4k-player | grep -q 'not found'; then
            echo 'ERROR: missing shared libraries'; exit 1
          fi
          tar -czf ${{ matrix.archive }} -C dist anime4k-player

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ runner.os }}
          path: |
            ${{ matrix.archive }}
            dist/*.exe

  publish:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          ls -la release-assets
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            release-assets/*
