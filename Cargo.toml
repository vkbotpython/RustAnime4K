[package]
name = "anime4k-player"
version = "1.0.1"
edition = "2024"
authors = ["avencores"]
description = "Video player with Anime4K image upscaling"
license = "GPL-3.0-or-later"
repository = "https://gitlab.com/avencores/RustAnime4KPlayer"

[[bin]]
name = "anime4k-player"
path = "src/main.rs"

[features]
default = []
# Real video playback via libmpv. Requires libmpv on the system at build time
# (Linux: apt install libmpv-dev; Windows: mpv dev files) and at runtime
# (libmpv.so / mpv-2.dll next to the binary). Without this feature the app
# builds and runs with a placeholder video surface (logic/UI fully testable).
# With `video` enabled you get real audio + video (egui render context,
# same approach as the old QOpenGLWidget/Video class) + full property
# control (incl. Anime4K glsl-shaders).
video = ["dep:libmpv2"]

[dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = { version = "0.37.0", features = ["monochrome_emoji_fonts"] }
egui_extras = { version = "0.37.0", default-features = false, features = ["image"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
dirs = "7.0.0"
anyhow = "1.0.104"
rfd = "0.17.2"
sys-locale = "0.3.2"
arboard = "3.7.0"
dark-light = "3.0.0"
# Raw window handle of the eframe window, for the DWM Mica/Acrylic backdrop.
raw-window-handle = "0.6.2"
libmpv2 = { version = "6.0.0", optional = true }

# DWM window materials (Mica/Acrylic) behind the window (see `src/mica.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
winres = "0.1.12"

[profile.release]
opt-level = 3
strip = true
# Smaller + slightly faster binary at the cost of slower linking.
lto = true
codegen-units = 1
