[package]
name = "anime4k-player"
version = "1.0.0"
edition = "2024"
authors = ["avencores"]
description = "Video player with Anime4K image upscaling"
license = "GPL-3.0-or-later"

[[bin]]
name = "anime4k-player"
path = "src/main.rs"

[features]
default = []
# Real video playback via libmpv. Requires libmpv on the system at build time
# (Linux: apt install libmpv-dev; Windows: mpv dev files) and at runtime
# (libmpv.so / mpv-2.dll next to the binary). Without this feature the app
# builds and runs with a placeholder video surface (logic/UI fully testable).
# With `video` enabled you get real audio + video (egui render context,
# same approach as the old QOpenGLWidget/Video class) + full property
# control (incl. Anime4K glsl-shaders).
video = ["dep:libmpv2"]

[dependencies]
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.35"
egui_extras = { version = "0.35", default-features = false, features = ["image"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
rfd = "0.17"
sys-locale = "0.3"
arboard = "2"
dark-light = "1"
libmpv2 = { version = "6", optional = true }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
strip = true
# Smaller + slightly faster binary at the cost of slower linking.
lto = true
codegen-units = 1
